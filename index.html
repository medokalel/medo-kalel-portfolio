<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.ico" />

    <title>Mohamed Khalil | Front-End Developer</title>
    <meta
      name="description"
      content="Front-end developer building fast, accessible, responsive websites with React, TypeScript and Tailwind CSS. Browse projects and get in touch."
    />
    <meta name="author" content="Mohamed Khalil" />
    <meta name="theme-color" content="#0a0a0f" />
    <!-- Applies the saved theme before first paint (no dark→light flash). Keep in sync with src/lib/theme.ts -->
    <script>
      try {
        var theme = localStorage.getItem("portfolio-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "light") {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#f8fafc");
          }
        }
      } catch (e) {}
    </script>
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="en" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="ar" href="%VITE_SITE_URL%/ar" />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohamed Khalil" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Mohamed Khalil | Front-End Developer" />
    <meta
      property="og:description"
      content="Front-end developer building fast, accessible, responsive websites with React, TypeScript and Tailwind CSS. Browse projects and get in touch."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohamed Khalil | Front-End Developer" />
    <meta
      name="twitter:description"
      content="Front-end developer building fast, accessible, responsive websites with React, TypeScript and Tailwind CSS. Browse projects and get in touch."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mohamed Khalil",
        "jobTitle": "Front-End Developer",
        "url": "%VITE_SITE_URL%/",
        "knowsLanguage": ["en", "ar"]
      }
    </script>
  </head>
  <body>
    <noscript>This site needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
